modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      files:
        - tailscale.repo
      keys:
        - keys/tailscale-fedora-repo.gpg
    install:
      packages:
        - clevis
        - clevis-luks
        - clevis-dracut
        - clevis-udisks2
        - clevis-systemd
        - NetworkManager-tui
        - fping
        - btop
        - btrfsmaintenance
        - duperemove
        - inotify-tools
        - udisks2
        - wireshark-cli
        - tailscale
        - dos2unix
        - tayga
        - radvd
        - traceroute
        - smartmontools
        - nmap
        - python3-dnslib
        - helix
        - python3-netifaces
